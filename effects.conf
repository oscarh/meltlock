# Lock screen effects. One of those that are "on" is picked at random each
# time the screen locks. Effects not listed here are on.
#
# Try one without locking:  timeout 5 meltlock bg silk overlay

melt    on   # dots drip down and pool at the bottom
sand    on   # bright parts fall as grains and pile up
ripple  on   # drops send rings through the picture
drift   on   # wind sorts each row into bands
life    on   # Conway's Game of Life grows from the picture
pulse   on   # the picture breathes slowly
silk    on   # fine threads flow along the outlines, full resolution
